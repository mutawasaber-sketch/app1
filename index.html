<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Groq AI Chat - شغال</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{font-family:'Tajawal',sans-serif}
body {overflow: hidden;}
#msgs::-webkit-scrollbar {width: 6px;}
#msgs::-webkit-scrollbar-track {background: transparent;}
#msgs::-webkit-scrollbar-thumb {background: rgba(255,255,255,0.2); border-radius: 3px;}
#msgs::-webkit-scrollbar-thumb:hover {background: rgba(255,255,255,0.3);}
.msg-user {animation: slideInRight 0.3s ease-out;}
.msg-ai {animation: slideInLeft 0.3s ease-out;}
@keyframes slideInRight {from {opacity: 0; transform: translateX(20px);} to {opacity: 1; transform: translateX(0);}}
@keyframes slideInLeft {from {opacity: 0; transform: translateX(-20px);} to {opacity: 1; transform: translateX(0);}}
.thinking {display: inline-block; animation: blink 1.4s infinite;}
.thinking span {animation: dot 1.4s infinite;}
.thinking span:nth-child(2) {animation-delay: 0.2s;}
.thinking span:nth-child(3) {animation-delay: 0.4s;}
@keyframes dot {0%,20% {opacity: 0.3;} 50% {opacity: 1;} 80%,100% {opacity: 0.3;}}
</style>
</head>
<body class="bg-[#07070a] text-white h-[100dvh] flex flex-col">

<!-- Header -->
<header class="h-16 border-b border-white/10 flex items-center justify-between px-4 bg-[#0f0f14] sticky top-0">
<div class="flex items-center gap-3">
<div class="w-9 h-9 rounded-xl bg-gradient-to-br from-violet-600 to-fuchsia-600 flex items-center justify-center font-black text-sm">⚡</div>
<div>
<div class="font-bold text-sm">Groq AI</div>
<div class="text-xs text-gray-400">Chat Intelligence</div>
</div>
</div>
<div class="flex gap-2">
<button onclick="openSet()" class="w-10 h-10 rounded-xl bg-white/10 hover:bg-white/20 transition font-bold text-base">⚙️</button>
<button onclick="newChat()" class="px-4 h-10 rounded-xl bg-gradient-to-r from-violet-600 to-fuchsia-600 hover:from-violet-700 hover:to-fuchsia-700 transition font-bold text-sm">+ جديد</button>
</div>
</header>

<!-- Main Container -->
<div class="flex-1 flex overflow-hidden">

<!-- Sidebar - Chat History -->
<aside class="w-[280px] bg-[#0f0f14] border-l border-white/10 p-3 hidden lg:flex flex-col overflow-hidden">
<div class="text-xs text-gray-400 mb-3 font-bold">المحادثات</div>
<div id="list" class="flex-1 overflow-y-auto space-y-2 pr-2"></div>
<div class="mt-3 pt-3 border-t border-white/10">
<button onclick="clearAll()" class="w-full h-10 rounded-lg bg-red-500/20 hover:bg-red-500/30 text-red-400 text-xs font-bold transition">مسح الكل</button>
</div>
</aside>

<!-- Main Chat Area -->
<main class="flex-1 flex flex-col bg-[#07070a]">
<!-- Messages Container -->
<div id="msgs" class="flex-1 overflow-y-auto p-4 space-y-3 flex flex-col"></div>

<!-- Input Area -->
<div class="p-4 border-t border-white/10 bg-[#0f0f14] flex-shrink-0">
<div class="max-w-4xl mx-auto flex gap-2">
<div class="flex-1 flex bg-[#1b1b22] border border-white/10 rounded-2xl p-2 hover:border-white/20 transition">
<textarea id="inp" rows="1" placeholder="اكتب رسالتك..." class="flex-1 bg-transparent text-white placeholder-gray-500 outline-none resize-none px-3"></textarea>
<button onclick="send()" id="sendBtn" class="w-10 h-10 rounded-xl bg-gradient-to-r from-violet-600 to-fuchsia-600 hover:from-violet-700 hover:to-fuchsia-700 transition flex items-center justify-center font-bold text-lg">
<span id="sendIcon">📤</span>
</button>
</div>
</div>
<div class="text-xs text-gray-500 text-center mt-2">Powered by Groq API</div>
</div>

</main>

</div>

<!-- Settings Modal -->
<div id="set" class="fixed inset-0 z-50 hidden flex items-center justify-center">
<div class="absolute inset-0 bg-black/70 backdrop-blur-sm" onclick="closeSet()"></div>
<div class="relative w-[92%] max-w-[500px] bg-[#15151b] border border-white/10 rounded-2xl p-6 shadow-2xl">
<button onclick="closeSet()" class="absolute top-3 left-3 text-2xl">✕</button>

<h2 class="text-xl font-bold mb-4">⚙️ الإعدادات</h2>

<div class="space-y-4">
<!-- API Key Input -->
<div>
<label class="block text-sm font-bold mb-2">🔑 Groq API Key</label>
<input id="key" type="password" class="w-full h-12 bg-white/5 border border-white/10 rounded-xl px-4 text-sm hover:bg-white/10 focus:bg-white/15 focus:border-violet-500 transition outline-none" placeholder="أدخل API Key...">
<button onclick="toggleKeyVisibility()" class="text-xs text-gray-400 mt-1">اظهر/اخفي</button>
</div>

<!-- Model Selection -->
<div>
<label class="block text-sm font-bold mb-2">🤖 اختر النموذج</label>
<select id="model" class="w-full h-11 bg-white/5 border border-white/10 rounded-xl px-3 text-sm hover:bg-white/10 focus:bg-white/15 focus:border-violet-500 transition outline-none">
<option value="llama-3.1-8b-instant">llama-3.1-8b-instant (الأسرع)</option>
<option value="llama-3.1-70b-versatile">llama-3.1-70b-versatile (الأفضل)</option>
<option value="mixtral-8x7b-32768">mixtral-8x7b-32768 (قوي)</option>
</select>
</div>

<!-- Buttons -->
<div class="flex gap-2 mt-6">
<button onclick="testKey()" class="flex-1 h-11 bg-white/10 hover:bg-white/20 rounded-xl font-bold text-sm transition">🧪 اختبر</button>
<button onclick="saveSet()" class="flex-1 h-11 bg-gradient-to-r from-violet-600 to-fuchsia-600 hover:from-violet-700 hover:to-fuchsia-700 rounded-xl font-bold text-sm transition">✅ حفظ</button>
</div>
</div>
</div>
</div>

<!-- Script -->
<script>
// Constants
const DEFAULT_KEY = "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";
const GROQ_API = 'https://api.groq.com/openai/v1/chat/completions';

// State Management
let apiKey = localStorage.getItem('groq_key') || DEFAULT_KEY;
let model = localStorage.getItem('groq_model') || "llama-3.1-8b-instant";
let chats = JSON.parse(localStorage.getItem('groq_chats') || '[]');
let active = localStorage.getItem('groq_active');
let generating = false;

// Initialize
document.getElementById('key').value = apiKey;
document.getElementById('model').value = model;

// Create default chat if needed
if (!chats.length) {
  let c = { id: Date.now().toString(), title: 'محادثة جديدة', msgs: [] };
  chats = [c];
  active = c.id;
}
if (!active) active = chats[0].id;

// Local Storage Management
function save() {
  localStorage.setItem('groq_chats', JSON.stringify(chats));
  localStorage.setItem('groq_active', active);
  localStorage.setItem('groq_key', apiKey);
  localStorage.setItem('groq_model', model);
}

// Get Active Chat
function getActive() {
  return chats.find(c => c.id === active);
}

// Render Chat List
function renderList() {
  let list = document.getElementById('list');
  list.innerHTML = '';
  chats.forEach(c => {
    let div = document.createElement('div');
    div.className = `p-3 rounded-xl cursor-pointer text-sm transition truncate ${
      c.id === active 
        ? 'bg-gradient-to-r from-violet-600/30 to-fuchsia-600/30 border border-violet-500/50' 
        : 'hover:bg-white/5 border border-transparent hover:border-white/10'
    }`;
    div.textContent = c.title || 'محادثة';
    div.onclick = () => {
      active = c.id;
      save();
      renderList();
      renderMsgs();
    };
    div.oncontextmenu = (e) => {
      e.preventDefault();
      if (chats.length > 1) {
        chats = chats.filter(x => x.id !== c.id);
        if (active === c.id) active = chats[0].id;
        save();
        renderList();
        renderMsgs();
      }
    };
    list.appendChild(div);
  });
}

// Render Messages
function renderMsgs() {
  let box = document.getElementById('msgs');
  let chat = getActive();
  box.innerHTML = '';
  
  if (!chat.msgs.length) {
    box.innerHTML = `
      <div class="flex-1 flex flex-col items-center justify-center text-gray-400">
        <div class="text-4xl mb-4">💬</div>
        <div class="text-center">
          <div class="font-bold">ابدأ محادثة جديدة</div>
          <div class="text-sm">اكتب سؤالك واضغط إرسال</div>
        </div>
      </div>
    `;
    return;
  }
  
  chat.msgs.forEach(m => {
    let div = document.createElement('div');
    div.className = `flex ${m.role === 'user' ? 'justify-end' : 'justify-start'} msg-${m.role === 'user' ? 'user' : 'ai'}`;
    
    let content = document.createElement('div');
    content.className = `max-w-[70%] rounded-2xl px-4 py-3 text-sm break-words ${
      m.role === 'user'
        ? 'bg-gradient-to-r from-violet-600 to-fuchsia-600 text-white rounded-br-none'
        : 'bg-[#1b1b22] text-gray-100 rounded-bl-none border border-white/10'
    }`;
    content.innerHTML = m.content.replace(/\n/g, '<br>');
    
    div.appendChild(content);
    box.appendChild(div);
  });
  
  box.scrollTop = box.scrollHeight;
}

// New Chat
function newChat() {
  let c = { id: Date.now().toString(), title: 'محادثة جديدة', msgs: [] };
  chats.unshift(c);
  active = c.id;
  save();
  renderList();
  renderMsgs();
  document.getElementById('inp').focus();
}

// Clear All
function clearAll() {
  if (confirm('هل متأكد تريد مسح كل المحادثات؟')) {
    chats = [];
    newChat();
  }
}

// Send Message
async function send() {
  let inp = document.getElementById('inp');
  let txt = inp.value.trim();
  
  if (!txt || generating) return;
  
  let chat = getActive();
  chat.msgs.push({ role: 'user', content: txt });
  
  // Auto-generate title
  if (chat.msgs.length === 1) {
    chat.title = txt.substring(0, 30) + (txt.length > 30 ? '...' : '');
  }
  
  inp.value = '';
  inp.style.height = 'auto';
  generating = true;
  document.getElementById('sendBtn').disabled = true;
  
  renderList();
  renderMsgs();
  
  let ai = { role: 'assistant', content: '⏳ جاري التفكير...' };
  chat.msgs.push(ai);
  renderMsgs();
  
  try {
    let res = await fetch(GROQ_API, {
      method: 'POST',
      headers: {
        'Authorization': 'Bearer ' + apiKey,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        model: model,
        messages: chat.msgs.map(m => ({ role: m.role, content: m.content })),
        max_tokens: 2048,
        temperature: 0.7
      })
    });
    
    if (!res.ok) throw new Error(`خطأ ${res.status}: تحقق من API Key`);
    
    let data = await res.json();
    let full = data.choices[0].message.content;
    
    ai.content = '';
    for (let i = 0; i < full.length; i++) {
      ai.content += full[i];
      if (i % 5 === 0) {
        renderMsgs();
        await new Promise(r => setTimeout(r, 5));
      }
    }
  } catch (e) {
    ai.content = '❌ خطأ: ' + e.message;
  }
  
  generating = false;
  document.getElementById('sendBtn').disabled = false;
  save();
  renderMsgs();
  inp.focus();
}

// Settings
function openSet() {
  document.getElementById('set').classList.remove('hidden');
}

function closeSet() {
  document.getElementById('set').classList.add('hidden');
}

function saveSet() {
  apiKey = document.getElementById('key').value.trim();
  model = document.getElementById('model').value;
  save();
  closeSet();
}

async function testKey() {
  let testKey = document.getElementById('key').value.trim();
  if (!testKey) {
    alert('أدخل API Key أولاً');
    return;
  }
  
  try {
    let res = await fetch(GROQ_API, {
      method: 'POST',
      headers: {
        'Authorization': 'Bearer ' + testKey,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        model: 'llama-3.1-8b-instant',
        messages: [{ role: 'user', content: 'مرحبا' }],
        max_tokens: 10
      })
    });
    
    if (res.ok) {
      alert('✅ API Key صحيح!');
    } else {
      alert('❌ API Key غير صحيح');
    }
  } catch (e) {
    alert('❌ خطأ: ' + e.message);
  }
}

function toggleKeyVisibility() {
  let keyInput = document.getElementById('key');
  keyInput.type = keyInput.type === 'password' ? 'text' : 'password';
}

// Keyboard Shortcuts
document.getElementById('inp').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    send();
  }
  if (e.key === 'Enter' && e.shiftKey) {
    // Shift+Enter for new line
  }
});

document.getElementById('inp').addEventListener('input', (e) => {
  e.target.style.height = 'auto';
  e.target.style.height = Math.min(e.target.scrollHeight, 120) + 'px';
});

// Initialize
renderList();
renderMsgs();
</script>

</body>
</html>
