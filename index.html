<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>شات ذكاء اصطناعي - كامل</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
*{font-family:'Tajawal',system-ui,sans-serif}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:#a78bfa55;border-radius:10px}
.typing span{animation:blink 1.4s infinite}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}
</style>
</head>
<body class="bg-[#0a0a0f] text-white h-[100dvh] flex overflow-hidden">
<aside id="sidebar" class="w-[300px] bg-[#121216] border-l border-white/10 flex flex-col shrink-0 fixed md:static h-full -right-[300px] md:right-0 z-40 transition-all">
  <div class="p-4 border-b border-white/10 flex justify-between"><div class="font-bold">🤖 شات الذكاء</div><button onclick="toggleSidebar()" class="md:hidden">✕</button></div>
  <div class="p-3"><button onclick="newChat()" class="w-full h-11 bg-gradient-to-r from-violet-600 to-indigo-600 rounded-xl font-bold">+ محادثة جديدة</button>
  <input id="searchChats" oninput="renderChats()" placeholder="ابحث..." class="w-full h-10 mt-3 bg-white/5 border border-white/10 rounded-xl px-3 text-sm"></div>
  <div id="chatList" class="flex-1 overflow-y-auto p-2 space-y-1"></div>
  <div class="p-3 border-t border-white/10"><button onclick="openSettings()" class="w-full h-11 bg-white/5 border border-white/10 rounded-xl">⚙️ الإعدادات - مكان المفتاح</button></div>
</aside>

<div class="flex-1 flex flex-col min-w-0">
  <header class="h-[64px] border-b border-white/10 flex items-center justify-between px-4">
    <div class="flex gap-2 items-center"><button onclick="toggleSidebar()" class="md:hidden p-2 bg-white/5 rounded-xl">☰</button><div id="currentTitle" class="font-bold">محادثة جديدة</div></div>
    <div class="flex gap-1"><button onclick="clearCurrent()" class="p-2.5 bg-white/5 rounded-xl">🗑️</button><button onclick="exportChat()" class="p-2.5 bg-white/5 rounded-xl">📤</button><button onclick="openSettings()" class="w-10 h-10 bg-white text-black rounded-xl font-bold">⚙️</button></div>
  </header>
  <div id="messages" class="flex-1 overflow-y-auto p-4 space-y-4"></div>
  <div class="p-3 border-t border-white/10 bg-[#0f0f14]">
    <div class="max-w-3xl mx-auto">
      <div id="imagePreview" class="hidden mb-2 flex gap-2 items-center bg-white/5 p-2 rounded-xl"><img id="previewImg" class="w-12 h-12 rounded-lg"><button onclick="removeImage()" class="p-1 bg-white/10 rounded">✕</button></div>
      <div class="flex gap-2 bg-[#1a1a21] border border-white/10 rounded-[22px] p-2">
        <button onclick="fileInput.click()" class="w-9 h-9 bg-white/5 rounded-full">🖼️</button>
        <textarea id="input" rows="1" placeholder="اكتب رسالتك..." class="flex-1 bg-transparent outline-none resize-none py-2.5" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage()}"></textarea>
        <button id="sendBtn" onclick="sendMessage()" class="w-10 h-10 bg-gradient-to-br from-violet-600 to-indigo-600 rounded-full">➤</button>
        <button id="stopBtn" onclick="stopGen()" class="hidden w-10 h-10 bg-red-500 rounded-full">■</button>
      </div>
      <div class="text-[11px] text-white/40 mt-2 flex justify-between"><span id="statusText">جاهز - محلي ذكي</span><span>Enter للإرسال</span></div>
    </div>
  </div>
</div>

<!-- الترس -->
<div id="settingsModal" class="fixed inset-0 z-[100] hidden"><div class="absolute inset-0 bg-black/70" onclick="closeSettings()"></div>
<div class="relative w-[92%] max-w-[520px] mx-auto mt-[6vh] bg-[#16161d] border border-white/10 rounded-[24px] overflow-hidden">
  <div class="p-5 border-b border-white/10 flex justify-between"><b>⚙️ الإعدادات - مكان المفتاح</b><button onclick="closeSettings()" class="w-9 h-9 bg-white/5 rounded-xl">✕</button></div>
  <div class="p-5 space-y-4">
    <div class="p-3 rounded-xl bg-violet-500/10 border border-violet-500/20 text-xs">لو عندك مفتاح OpenAI حطه هنا. لو فاضي هيشتغل ذكي بدون نت.</div>
    <label class="text-sm font-bold">🔑 مفتاح API</label>
    <input id="apiKey" type="password" placeholder="sk-... اتركه فاضي للوضع الذكي" class="w-full h-12 bg-white/5 border border-white/10 rounded-xl px-4 text-sm">
    <div class="grid grid-cols-2 gap-3"><select id="model" class="h-11 bg-white/5 border border-white/10 rounded-xl px-3 text-sm"><option value="local">محلي ذكي (بدون مفتاح)</option><option value="gpt-4o-mini">GPT-4o Mini</option><option value="gpt-4o">GPT-4o</option><option value="gemini-1.5-flash">Gemini Flash</option></select><input id="temp" type="range" min="0" max="1" step="0.1" value="0.7"></div>
    <textarea id="sysPrompt" rows="3" class="w-full bg-white/5 border border-white/10 rounded-xl p-3 text-sm">أنت مساعد ذكي يرد بالعربية بود.</textarea>
    <div class="flex gap-2"><button onclick="saveSettings()" class="flex-1 h-11 bg-violet-600 rounded-xl font-bold">💾 حفظ</button><button onclick="testKey()" class="flex-1 h-11 bg-white/5 border border-white/10 rounded-xl">🧪 اختبار</button></div>
    <div id="keyStatus" class="hidden p-3 rounded-xl text-xs border"></div>
  </div>
</div></div>

<input id="fileInput" type="file" accept="image/*" hidden>
<script>
let chats=JSON.parse(localStorage.getItem('ai_chats')||'[]'); let activeId=localStorage.getItem('ai_active')||null;
let settings=JSON.parse(localStorage.getItem('ai_settings')||'null')||{apiKey:'',model:'local',temperature:0.7,systemPrompt:'أنت مساعد ذكي عربي.'};
let generating=false,abort=false,attachedImage=null;
document.getElementById('apiKey').value=settings.apiKey; document.getElementById('model').value=settings.model;
function save(){localStorage.setItem('ai_chats',JSON.stringify(chats));localStorage.setItem('ai_active',activeId||'');localStorage.setItem('ai_settings',JSON.stringify(settings));}
if(!chats.length){let c={id:Math.random().toString(36).slice(2,7),title:'محادثة جديدة',messages:[]};chats.push(c);activeId=c.id;save();}
if(!activeId)activeId=chats[0].id;
function newChat(){let c={id:Math.random().toString(36).slice(2,7),title:'محادثة جديدة',messages:[]};chats.unshift(c);activeId=c.id;save();renderChats();renderMessages();}
function getActive(){return chats.find(c=>c.id===activeId)}
function renderChats(){let q=(document.getElementById('searchChats').value||'').toLowerCase();let l=document.getElementById('chatList');l.innerHTML='';chats.filter(c=>c.title.toLowerCase().includes(q)).forEach(c=>{let d=document.createElement('div');d.className=`p-3 rounded-xl cursor-pointer border ${c.id===activeId?'bg-white text-black':'bg-white/5 border-white/5 text-white'}`;d.innerHTML=`<div class="font-bold text-sm truncate">${c.title}</div><div class="text-xs opacity-60 truncate">${c.messages.length?c.messages[c.messages.length-1].content.slice(0,30):'لا رسائل'}</div>`;d.onclick=()=>{activeId=c.id;save();renderChats();renderMessages();};l.appendChild(d);});}
function renderMessages(){let box=document.getElementById('messages');let chat=getActive();if(!chat)return;document.getElementById('currentTitle').innerText=chat.title;box.innerHTML='';chat.messages.forEach(m=>{let row=document.createElement('div');row.className=`flex gap-2 ${m.role==='user'?'justify-end':''}`;let b=`<div class="max-w-[80%] rounded-[18px] px-4 py-3 text-sm ${m.role==='user'?'bg-violet-600 text-white':'bg-[#1c1c23] border border-white/10'}"><div style="white-space:pre-wrap">${m.content.replace(/</g,'&lt;').replace(/```/g,'')}</div>${m.image?`<img src="${m.image}" class="mt-2 rounded-xl max-h-[200px]">`:''}<div class="flex gap-1 mt-2"><button onclick="navigator.clipboard.writeText(\`${m.content.replace(/`/g,'\\`')}\`)" class="px-2 py-1 bg-white/10 rounded text-xs">نسخ</button></div></div>`;row.innerHTML=m.role==='user'?b+`<div class="w-8 h-8 bg-white text-black rounded-full flex items-center justify-center">أ</div>`:`<div class="w-8 h-8 bg-violet-600 rounded-full flex items-center justify-center">🤖</div>`+b;box.appendChild(row);});if(generating){let d=document.createElement('div');d.innerHTML=`<div class="flex gap-2"><div class="w-8 h-8 bg-violet-600 rounded-full flex items-center justify-center">🤖</div><div class="bg-[#1c1c23] border border-white/10 rounded-xl px-4 py-3 typing"><span>●</span><span>●</span><span>●</span></div></div>`;box.appendChild(d);}box.scrollTop=box.scrollHeight;}
async function sendMessage(){let inp=document.getElementById('input');let t=inp.value.trim();if(!t&&!attachedImage)return;let chat=getActive();chat.messages.push({role:'user',content:t,image:attachedImage});if(chat.messages.length===1)chat.title=t.slice(0,30);inp.value='';attachedImage=null;document.getElementById('imagePreview').classList.add('hidden');save();renderChats();renderMessages();generating=true;abort=false;document.getElementById('sendBtn').classList.add('hidden');document.getElementById('stopBtn').classList.remove('hidden');try{let resp='';if(settings.apiKey&&settings.model!=='local'){resp=await callAPI(chat.messages);}else{resp=smart(t);}let am={role:'assistant',content:''};chat.messages.push(am);for(let i=0;i<resp.length;i++){if(abort)break;am.content+=resp[i];if(i%5===0){renderMessages();await new Promise(r=>setTimeout(r,10));}}am.content=resp;}catch(e){chat.messages.push({role:'assistant',content:'❌ خطأ: '+e.message});}generating=false;document.getElementById('sendBtn').classList.remove('hidden');document.getElementById('stopBtn').classList.add('hidden');save();renderMessages();}
function smart(input){let t=input.toLowerCase();if(t.includes('من انت'))return'أنا مساعدك الذكي 🤖 أقدر أكتب كود، أشرح مفاهيم، وأساعدك بالعربية. وضعي الحالي محلي ذكي يعمل بدون إنترنت.';if(t.includes('كود')||t.includes('javascript'))return'أكيد!\n\n```javascript\nfunction hello(){\n console.log("مرحبا يا صابر!");\n}\nhello();\n```\n\nده كود بسيط، تحب أطوره؟';return `فهمت طلبك: "${input.slice(0,50)}"\n\nده حل سريع ومنظم:\n1. نحدد الهدف\n2. نكتب نسخة أولية\n3. نحسنها\n\nقول لي تركيزك على ايه الآن؟`;}
async function callAPI(msgs){let sys=settings.systemPrompt;if(settings.model.startsWith('gpt')){let r=await fetch('https://api.openai.com/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+settings.apiKey},body:JSON.stringify({model:settings.model==='gpt-4o-mini'?'gpt-4o-mini':'gpt-4o',messages:[{role:'system',content:sys},...msgs.slice(-8).map(m=>({role:m.role,content:m.content}))]})});if(!r.ok)throw new Error(await r.text());let d=await r.json();return d.choices[0].message.content;}else{let r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${settings.model}:generateContent?key=${settings.apiKey}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:sys+'\n'+msgs.map(m=>m.content).join('\n')}]}]})});if(!r.ok)throw new Error(await r.text());let d=await r.json();return d.candidates[0].content.parts[0].text;}}
function toggleSidebar(){let s=document.getElementById('sidebar');s.classList.toggle('-right-[300px]');s.classList.toggle('right-0');}
function openSettings(){document.getElementById('settingsModal').classList.remove('hidden')}function closeSettings(){document.getElementById('settingsModal').classList.add('hidden')}
function saveSettings(){settings.apiKey=document.getElementById('apiKey').value;settings.model=document.getElementById('model').value;settings.temperature=parseFloat(document.getElementById('temp').value);settings.systemPrompt=document.getElementById('sysPrompt').value;save();closeSettings();document.getElementById('statusText').innerText=settings.apiKey?'متصل: '+settings.model:'محلي ذكي';}
async function testKey(){let k=document.getElementById('apiKey').value;if(!k){alert('حط المفتاح');return;}try{settings.apiKey=k;let r=await callAPI([{content:'قل مرحبا'}]);document.getElementById('keyStatus').className='p-3 rounded-xl bg-emerald-500/10 border border-emerald-500/20 text-xs';document.getElementById('keyStatus').innerText='شغال ✅: '+r.slice(0,100);document.getElementById('keyStatus').classList.remove('hidden');}catch(e){let el=document.getElementById('keyStatus');el.className='p-3 rounded-xl bg-red-500/10 border border-red-500/20 text-xs';el.innerText='فشل: '+e.message;el.classList.remove('hidden');}}
function clearCurrent(){if(confirm('تمسح؟')){getActive().messages=[];save();renderMessages();}}
function exportChat(){let c=getActive();let txt=c.messages.map(m=>m.role+': '+m.content).join('\n\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt]));a.download=c.title+'.txt';a.click();}
document.getElementById('fileInput').onchange=e=>{let f=e.target.files[0];let r=new FileReader();r.onload=()=>{attachedImage=r.result;document.getElementById('previewImg').src=r.result;document.getElementById('imagePreview').classList.remove('hidden');};r.readAsDataURL(f);}
function removeImage(){attachedImage=null;document.getElementById('imagePreview').classList.add('hidden');}
renderChats();renderMessages();
</script>
</body>
</html>
