<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Groq AI Chat - شغال</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800&display=swap" rel="stylesheet">
<style>*{font-family:'Tajawal',sans-serif}</style>
</head>
<body class="bg-[#07070a] text-white h-[100dvh] flex flex-col">
<header class="h-16 border-b border-white/10 flex items-center justify-between px-4 bg-[#0f0f14]">
<div class="flex items-center gap-3"><div class="w-9 h-9 rounded-xl bg-gradient-to-br from-violet-600 to-fuchsia-600 flex items-center justify-center font-black">G</div><div><div class="font-extrabold">Groq Chat</div><div class="text-[11px] text-white/50">شغال بمفتاحك</div></div></div>
<div class="flex gap-2"><button onclick="openSet()" class="w-10 h-10 rounded-xl bg-white text-black font-bold">⚙️</button><button onclick="newChat()" class="px-4 h-10 rounded-xl bg-violet-600 font-bold">+ جديد</button></div>
</header>
<div class="flex-1 flex overflow-hidden">
<aside class="w-[280px] bg-[#0f0f14] border-l border-white/10 p-3 hidden md:flex flex-col"><div id="list" class="flex-1 overflow-y-auto space-y-2"></div></aside>
<main class="flex-1 flex flex-col">
<div id="msgs" class="flex-1 overflow-y-auto p-4 space-y-4"></div>
<div class="p-3 border-t border-white/10 bg-[#0f0f14]"><div class="max-w-3xl mx-auto flex gap-2 bg-[#1b1b22] border border-white/10 rounded-[20px] p-2"><textarea id="inp" rows="1" placeholder="اكتب سؤالك..." class="flex-1 bg-transparent outline-none resize-none py-2" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}"></textarea><button onclick="send()" class="w-11 h-11 rounded-full bg-violet-600 font-bold">➤</button></div><div id="status" class="text-[11px] text-white/40 mt-2 text-center">Groq • llama-3.1-8b-instant • جاهز</div></div>
</main>
</div>

<div id="set" class="fixed inset-0 z-50 hidden"><div class="absolute inset-0 bg-black/70" onclick="closeSet()"></div><div class="relative w-[92%] max-w-[480px] mx-auto mt-[10vh] bg-[#15151b] border border-white/10 rounded-[22px] p-5"><div class="flex justify-between mb-4"><b>⚙️ مكان المفتاح</b><button onclick="closeSet()" class="w-8 h-8 bg-white/10 rounded-lg">✕</button></div>
<input id="key" class="w-full h-12 bg-white/5 border border-white/10 rounded-xl px-4 text-sm" value="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">
<select id="model" class="w-full h-11 mt-3 bg-white/5 border border-white/10 rounded-xl px-3 text-sm"><option value="llama-3.1-8b-instant">llama-3.1-8b-instant (أسرع)</option><option value="llama-3.3-70b-versatile">llama-3.3-70b (أذكى)</option></select>
<div class="flex gap-2 mt-5"><button onclick="saveSet()" class="flex-1 h-11 bg-violet-600 rounded-xl font-bold">حفظ ✅</button><button onclick="testKey()" class="flex-1 h-11 bg-white/5 border rounded-xl">اختبار</button></div><div id="kstat" class="hidden mt-3 p-3 rounded-xl text-xs border"></div>
</div></div>

<script>
const DEFAULT_KEY = "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";
let apiKey = localStorage.getItem('groq_key') || DEFAULT_KEY;
let model = localStorage.getItem('groq_model') || "llama-3.1-8b-instant";
document.getElementById('key').value = apiKey;
document.getElementById('model').value = model;
let chats = JSON.parse(localStorage.getItem('groq_chats')||'[]'); let active = localStorage.getItem('groq_active');
if(!chats.length){let c={id:'1',title:'محادثة جديدة',msgs:[]}; chats=[c]; active=c.id;} if(!active) active=chats[0].id;
function save(){localStorage.setItem('groq_chats',JSON.stringify(chats)); localStorage.setItem('groq_active',active); localStorage.setItem('groq_key',apiKey); localStorage.setItem('groq_model',model);}
function getA(){return chats.find(c=>c.id===active)}
function newChat(){let c={id:Date.now().toString(),title:'محادثة جديدة',msgs:[]}; chats.unshift(c); active=c.id; save(); renderList(); renderMsgs();}
function renderList(){let l=document.getElementById('list'); l.innerHTML=''; chats.forEach(c=>{let d=document.createElement('div'); d.className=`p-3 rounded-xl cursor-pointer text-sm ${c.id===active?'bg-white text-black':'bg-white/5'}`; d.innerHTML=`<b>${c.title}</b>`; d.onclick=()=>{active=c.id; save(); renderList(); renderMsgs();}; l.appendChild(d);});}
function renderMsgs(){let b=document.getElementById('msgs'); let ch=getA(); b.innerHTML=''; ch.msgs.forEach(m=>{let r=document.createElement('div'); r.className=`flex ${m.role==='user'?'justify-end':''}`; r.innerHTML=`<div class="max-w-[85%] rounded-[18px] px-4 py-3 text-[14px] ${m.role==='user'?'bg-violet-600':'bg-[#1e1e26] border border-white/10'}"><div style="white-space:pre-wrap">${m.content.replace(/</g,'&lt;')}</div></div>`; b.appendChild(r);}); b.scrollTop=b.scrollHeight;}
let gen=false;
async function send(){let inp=document.getElementById('inp'); let txt=inp.value.trim(); if(!txt||gen) return; let ch=getA(); ch.msgs.push({role:'user',content:txt}); if(ch.msgs.length===1) ch.title=txt.slice(0,30); inp.value=''; save(); renderList(); renderMsgs(); gen=true; let ai={role:'assistant',content:''}; ch.msgs.push(ai);
try{
let res=await fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',headers:{'Authorization':'Bearer '+apiKey,'Content-Type':'application/json'},body:JSON.stringify({model:model,messages:[{role:'system',content:'أنت مساعد ذكي ترد بالعربية'},...ch.msgs.slice(-10).map(m=>({role:m.role,content:m.content})).slice(0,-1)],temperature:0.7})});
if(!res.ok) throw new Error(await res.text());
let data=await res.json(); let full=data.choices[0].message.content;
for(let i=0;i<full.length;i++){ai.content+=full[i]; if(i%4===0){renderMsgs(); await new Promise(r=>setTimeout(r,8));}} ai.content=full;
}catch(e){ai.content='❌ خطأ: '+e.message;}
gen=false; save(); renderMsgs();}
function openSet(){document.getElementById('set').classList.remove('hidden')}function closeSet(){document.getElementById('set').classList.add('hidden')}
function saveSet(){apiKey=document.getElementById('key').value.trim(); model=document.getElementById('model').value; save(); closeSet();}
renderList(); renderMsgs();
</script>
</body>
</html>
