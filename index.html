<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aqlak - عقلك</title>
<style>
*{box-sizing:border-box;font-family:'Cairo','Segoe UI',sans-serif}
body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#1e3a8a,#0f172a 70%);color:#fff;display:flex;flex-direction:column;align-items:center;padding:15px}
.glass{background:rgba(255,255,255,.08);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.15);border-radius:24px;box-shadow:0 8px 32px rgba(0,0,0,.3)}
.header{width:100%;max-width:620px;padding:18px;text-align:center;margin-bottom:12px}
.header h1{margin:0;font-size:28px;background:linear-gradient(90deg,#a5b4fc,#22d3ee);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.status{color:#4ade80;font-size:14px;margin-top:5px}
#chat{width:100%;max-width:620px;height:52vh;overflow-y:auto;padding:18px;margin-bottom:12px;display:flex;flex-direction:column}
.msg{padding:12px 16px;margin:6px 0;border-radius:18px;max-width:85%;line-height:1.6;animation:fade .3s}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1}}
.user{background:linear-gradient(135deg,#6366f1,#8b5cf6);align-self:flex-start;border-bottom-right-radius:5px}
.ai{background:rgba(255,255,255,.12);align-self:flex-end;border-bottom-left-radius:5px;border:1px solid rgba(255,255,255,.1)}
.panel{width:100%;max-width:620px;padding:16px}
.row{display:flex;gap:10px;margin-bottom:10px}
input{flex:1;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.1);color:#fff;padding:14px;border-radius:14px;outline:none;font-size:15px}
input:focus{border-color:#6366f1}
button{border:none;padding:14px 22px;border-radius:14px;font-weight:bold;cursor:pointer;font-size:15px;transition:.2s}
.btn-send{background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff;min-width:100px}
.btn-send:hover{transform:scale(1.05)}
.btn-save{background:#3b82f6;color:#fff}
.btn-rem{background:rgba(255,255,255,.1);color:#fff;width:100%;border:1px solid rgba(255,255,255,.15)}
</style>
</head>
<body>
<div class="header glass">
<h1>عقلك - Aqlak</h1>
<div class="status">● AI Assistant • Online</div>
</div>
<div id="chat" class="glass"></div>
<div class="panel glass">
<div class="row">
<input type="password" id="apiKey" placeholder="🔑 الصق مفتاح API هنا">
<button class="btn-save" onclick="saveKey()">حفظ</button>
</div>
<div class="row">
<input type="text" id="in" placeholder="اكتب رسالتك... مرحبا">
<button class="btn-send" onclick="send()">إرسال ➤</button>
</div>
<button class="btn-rem" onclick="remind()">⏰ تذكير بعد ساعة</button>
</div>
<script>
let
