<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مهامي</title>
<style>
body{font-family:system-ui;background:#0f172a;color:#fff;margin:0;padding:20px}
.container{max-width:500px;margin:auto}
h1{text-align:center;color:#38bdf8}
.input-box{display:flex;gap:10px;margin:20px 0}
input{flex:1;padding:12px;border-radius:10px;border:none;outline:none}
button{padding:12px 18px;border:none;border-radius:10px;background:#38bdf8;color:#000;font-weight:bold;cursor:pointer}
.task{background:#1e293b;padding:12px;border-radius:10px;margin:10px 0;display:flex;justify-content:space-between;align-items:center}
.task.done{opacity:.5;text-decoration:line-through}
.delete{background:#ef4444;color:#fff;padding:6px 10px}
</style>
</head>
<body>
<div class="container">
<h1>مهامي اليومية</h1>
<div class="input-box">
<input id="taskInput" placeholder="اكتب مهمة جديدة...">
<button onclick="addTask()">ضيف</button>
</div>
<div id="list"></div>
</div>
<script>
function addTask(){
let v=document.getElementById('taskInput').value.trim();
if(!v) return;
let div=document.createElement('div');
div.className='task';
div.innerHTML=`<span onclick="this.parentElement.classList.toggle('done')">${v}</span><button class="delete" onclick="this.parentElement.remove()">حذف</button>`;
document.getElementById('list').appendChild(div);
document.getElementById('taskInput').value='';
}
</script>
</body>
</html>
